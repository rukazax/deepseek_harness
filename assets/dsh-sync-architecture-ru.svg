<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b7cfa"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3fb27f"/>
    </marker>
    <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c9a227"/>
    </marker>
  </defs>
  <rect width="980" height="420" fill="#0f1217"/>
  <text x="24" y="44" fill="#e8eef7" font-size="22" font-weight="600">dsh-sync: синхронизация истории сессий DSH</text>

  <rect x="24" y="86" width="250" height="112" rx="10" fill="#172033" stroke="#3b4658" stroke-width="2"/>
  <text x="149" y="116" fill="#dfe8f5" font-size="15" font-weight="600" text-anchor="middle">Windows: DSH desktop</text>
  <text x="149" y="142" fill="#9fb0c8" font-size="13" text-anchor="middle">%USERPROFILE%\.dsh\sessions</text>
  <text x="149" y="164" fill="#9fb0c8" font-size="13" text-anchor="middle">attachments\v1\objects</text>

  <rect x="330" y="80" width="320" height="124" rx="10" fill="#172033" stroke="#5b7cfa" stroke-width="2"/>
  <text x="490" y="110" fill="#dfe8f5" font-size="15" font-weight="600" text-anchor="middle">sync-dsh-sessions.ps1</text>
  <text x="490" y="136" fill="#9fb0c8" font-size="13" text-anchor="middle">вход + каждые 5 мин · блокировка</text>
  <text x="490" y="158" fill="#9fb0c8" font-size="13" text-anchor="middle">sha256 → направления → ssh/scp</text>
  <text x="490" y="182" fill="#c9a227" font-size="12" text-anchor="middle">без вызовов моделей: токены не тратятся</text>

  <rect x="330" y="238" width="320" height="76" rx="10" fill="#172033" stroke="#3b4658" stroke-width="2"/>
  <text x="490" y="266" fill="#dfe8f5" font-size="15" font-weight="600" text-anchor="middle">convert.js</text>
  <text x="490" y="290" fill="#9fb0c8" font-size="13" text-anchor="middle">cwd в заголовке → POSIX / Windows, zstd</text>

  <rect x="706" y="86" width="250" height="112" rx="10" fill="#172033" stroke="#3fb27f" stroke-width="2"/>
  <text x="831" y="116" fill="#dfe8f5" font-size="15" font-weight="600" text-anchor="middle">Debian: DSH web</text>
  <text x="831" y="142" fill="#9fb0c8" font-size="13" text-anchor="middle">/root/.dsh/sessions</text>
  <text x="831" y="164" fill="#9fb0c8" font-size="13" text-anchor="middle">/root/dsh-ws/&lt;X&gt;</text>

  <path d="M274 128 L326 128" stroke="#5b7cfa" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M326 160 L278 160" stroke="#3fb27f" stroke-width="2" marker-end="url(#ag)"/>
  <path d="M654 128 L702 128" stroke="#5b7cfa" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M702 160 L658 160" stroke="#3fb27f" stroke-width="2" marker-end="url(#ag)"/>
  <path d="M490 204 L490 234" stroke="#c9a227" stroke-width="2" marker-end="url(#ay)"/>

  <rect x="24" y="336" width="932" height="60" rx="10" fill="#131a26" stroke="#2b3648" stroke-width="1.5"/>
  <text x="40" y="362" fill="#9fb0c8" font-size="13">Состояние: %USERPROFILE%\.dsh\sync\state.json · блокировка sync.lock · журнал sync.log</text>
  <text x="40" y="384" fill="#9fb0c8" font-size="13">Конфликты: побеждает более новый файл, проигравший — в backup/&lt;время&gt;/&lt;id&gt;</text>
  <text x="700" y="374" fill="#c9a227" font-size="13" text-anchor="end">push → · ← pull</text>
</svg>
