<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="980" height="400" fill="#0f1217"/>
  <text x="24" y="44" fill="#e8eef7" font-size="22" font-weight="600">claude-bridge: a Claude subscription inside DSH</text>

  <g stroke="#3b4658" stroke-width="2" fill="none">
    <rect x="24" y="96" width="180" height="70" rx="10" fill="#172033"/>
    <rect x="258" y="96" width="230" height="70" rx="10" fill="#101a2b"/>
    <rect x="542" y="96" width="210" height="70" rx="10" fill="#172033"/>
    <rect x="796" y="96" width="160" height="70" rx="10" fill="#172033"/>
    <rect x="258" y="252" width="230" height="70" rx="10" fill="#172033"/>
    <rect x="542" y="252" width="210" height="70" rx="10" fill="#172033"/>
  </g>

  <g fill="#dfe8f5" font-size="15" text-anchor="middle">
    <text x="114" y="136">DSH</text>
    <text x="373" y="128">claude-bridge</text>
    <text x="373" y="150" fill="#9fb0c8" font-size="13">127.0.0.1:8790</text>
    <text x="647" y="128">Claude Code CLI</text>
    <text x="647" y="150" fill="#9fb0c8" font-size="13">claude -p …</text>
    <text x="876" y="128">claude.ai</text>
    <text x="876" y="150" fill="#9fb0c8" font-size="13">subscription OAuth</text>
    <text x="373" y="292">GET /health</text>
    <text x="647" y="292">POST /v1/messages</text>
  </g>

  <g stroke="#5b7cfa" stroke-width="2" marker-end="url(#a)" fill="none">
    <path d="M204 131 H258"/>
    <path d="M488 131 H542"/>
    <path d="M752 131 H796"/>
    <path d="M647 252 V166"/>
  </g>

  <g stroke="#3fb27f" stroke-width="2" marker-end="url(#b)" fill="none">
    <path d="M373 166 V252"/>
    <path d="M258 287 H204 V166"/>
  </g>

  <g fill="#9fb0c8" font-size="13">
    <text x="210" y="118">anthropic-messages</text>
    <text x="494" y="118">JSON · SSE</text>
    <text x="756" y="118">grant</text>
    <text x="386" y="215">reply / stream</text>
  </g>

  <text x="24" y="380" fill="#9fb0c8" font-size="13">No API key: usage is billed against the Pro/Max subscription. CLI tools are disabled.</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9z" fill="#5b7cfa"/></marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9z" fill="#3fb27f"/></marker>
  </defs>
</svg>
