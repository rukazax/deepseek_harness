<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b7cfa"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3fb27f"/>
    </marker>
    <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c9a227"/>
    </marker>
  </defs>
  <rect width="980" height="420" fill="#0f1217"/>
  <text x="24" y="44" fill="#e8eef7" font-size="22" font-weight="600">dsh-mobile: что в репозитории и что работает</text>

  <rect x="24" y="86" width="250" height="76" rx="10" fill="#172033" stroke="#3b4658" stroke-width="2"/>
  <text x="149" y="118" fill="#dfe8f5" font-size="15" text-anchor="middle">DeepSeek Harness</text>
  <text x="149" y="140" fill="#9fb0c8" font-size="13" text-anchor="middle">профиль desktop / web</text>

  <rect x="360" y="70" width="270" height="108" rx="10" fill="#172033" stroke="#5b7cfa" stroke-width="2"/>
  <text x="495" y="100" fill="#dfe8f5" font-size="15" text-anchor="middle">this repo: dsh-mobile 0.1.0</text>
  <text x="495" y="122" fill="#9fb0c8" font-size="13" text-anchor="middle">LAN-шлюз :3081, pairing, SSE, PWA</text>
  <text x="495" y="144" fill="#9fb0c8" font-size="13" text-anchor="middle">прототип, в эксплуатации не стоит</text>
  <text x="495" y="164" fill="#c9a227" font-size="12" text-anchor="middle">пакет опубликован, но не развёрнут</text>

  <rect x="700" y="70" width="256" height="108" rx="10" fill="#101a2b" stroke="#3fb27f" stroke-width="2"/>
  <text x="828" y="100" fill="#dfe8f5" font-size="15" text-anchor="middle">saya-ch/dsh-mobile 0.6.16</text>
  <text x="828" y="122" fill="#9fb0c8" font-size="13" text-anchor="middle">Apache-2.0, npm-пакет с тем же именем</text>
  <text x="828" y="144" fill="#9fb0c8" font-size="13" text-anchor="middle">LAN/FRP-фуннель, Caddy, Android App</text>
  <text x="828" y="164" fill="#3fb27f" font-size="12" text-anchor="middle">это и есть рабочая связка</text>

  <rect x="700" y="250" width="256" height="76" rx="10" fill="#172033" stroke="#3b4658" stroke-width="2"/>
  <text x="828" y="282" fill="#dfe8f5" font-size="15" text-anchor="middle">Телефон: PWA и APK</text>
  <text x="828" y="304" fill="#9fb0c8" font-size="13" text-anchor="middle">io.github.sayach.dshmobile 0.6.7</text>

  <rect x="360" y="250" width="270" height="76" rx="10" fill="#172033" stroke="#3b4658" stroke-width="2"/>
  <text x="495" y="282" fill="#dfe8f5" font-size="15" text-anchor="middle">Сравнение</text>
  <text x="495" y="304" fill="#9fb0c8" font-size="13" text-anchor="middle">одинаковое имя пакета, разные продукты</text>

  <g stroke="#5b7cfa" stroke-width="2" fill="none" marker-end="url(#ar)">
    <path d="M274 124 H360"/>
  </g>
  <g stroke="#3fb27f" stroke-width="2" fill="none" marker-end="url(#ag)">
    <path d="M630 124 H700"/>
    <path d="M828 178 V250"/>
  </g>
  <g stroke="#c9a227" stroke-width="2" fill="none" marker-end="url(#ay)">
    <path d="M495 178 V250"/>
  </g>

  <g fill="#9fb0c8" font-size="13">
    <text x="282" y="112">установка по имени</text>
    <text x="636" y="112">npm i dsh-mobile</text>
    <text x="836" y="222">APK / PWA</text>
    <text x="502" y="222">разбор</text>
  </g>

  <text x="24" y="380" fill="#9fb0c8" font-size="13">Вывод: одноимённый пакет в этом репозитории — ранний прототип; в работе используется upstream 0.6.16.</text>
  <text x="24" y="402" fill="#9fb0c8" font-size="13">Ставить по имени нельзя, не проверив источник: npm-имя принадлежит upstream-проекту.</text>
</svg>
