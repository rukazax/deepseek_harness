<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title">
  <title id="title">dsh-locale-ru — how the plugin plugs into DeepSeek Harness</title>
  <style>
    .box { fill: #ffffff; stroke: #c9d1d9; stroke-width: 1.5; rx: 10; }
    .accent { fill: #f3f8ff; stroke: #4B6BFB; stroke-width: 1.8; }
    .store { fill: #fffdf5; stroke: #d4a72c; stroke-width: 1.5; }
    .t { font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 14px; fill: #1f2328; }
    .h { font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 15px; font-weight: 600; fill: #1f2328; }
    .s { font-family: -apple-system, Segoe UI, Roboto, sans-serif; font-size: 12px; fill: #57606a; }
    .arrow { stroke: #4B6BFB; stroke-width: 2; fill: none; marker-end: url(#a); }
    .dash { stroke: #8c959f; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; marker-end: url(#d); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B6BFB"/>
    </marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
  </defs>

  <text class="h" x="24" y="30">dsh-locale-ru · how it works</text>

  <rect class="box" x="24" y="60" width="200" height="86"/>
  <text class="h" x="40" y="88">DSH web UI</text>
  <text class="s" x="40" y="110">Settings → General → Language</text>
  <text class="s" x="40" y="130">entry «Русский»</text>

  <rect class="box" x="270" y="60" width="200" height="86"/>
  <text class="h" x="286" y="88">dsh-client-locale</text>
  <text class="s" x="286" y="110">ctx.locale.define(...)</text>
  <text class="s" x="286" y="130">fallback chain ru → en</text>

  <rect class="accent" x="516" y="46" width="200" height="114"/>
  <text class="h" x="532" y="74">dsh-locale-ru</text>
  <text class="s" x="532" y="96">lib/client.js — bundle</text>
  <text class="s" x="532" y="116">locales/ru.json — 30</text>
  <text class="s" x="532" y="134">namespaces</text>
  <text class="s" x="532" y="152">1620+ lines</text>

  <rect class="store" x="762" y="60" width="114" height="86"/>
  <text class="h" x="776" y="88">ru.json</text>
  <text class="s" x="776" y="110">translation</text>
  <text class="s" x="776" y="130">source</text>

  <path class="arrow" d="M224,103 H262"/>
  <path class="arrow" d="M470,103 H508"/>
  <path class="dash" d="M716,103 H754"/>

  <rect class="box" x="270" y="196" width="446" height="76"/>
  <text class="h" x="286" y="224">lib/index.js — host half</text>
  <text class="s" x="286" y="246">export function apply() {}</text>
  <text class="s" x="286" y="264">exists only so the package has a Loader row</text>

  <path class="dash" d="M616,196 V168"/>

  <rect class="box" x="24" y="196" width="200" height="76"/>
  <text class="h" x="40" y="224">tools/install.mjs</text>
  <text class="s" x="40" y="246">copies the package into a profile</text>
  <text class="s" x="40" y="264">and adds the Loader row</text>
  <path class="arrow" d="M224,234 H262"/>

  <text class="s" x="24" y="306">Untranslated keys stay English: the language declares ru with an en fallback.</text>
</svg>
