<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="980" height="360" fill="#0f1217"/>
  <text x="24" y="44" fill="#e8eef7" font-size="22" font-weight="600">dsh-mobile-spike: plugin lifecycle</text>
  <g stroke="#3b4658" stroke-width="2" fill="none">
    <rect x="24" y="100" width="170" height="64" rx="10" fill="#172033"/>
    <rect x="236" y="100" width="200" height="64" rx="10" fill="#172033"/>
    <rect x="478" y="100" width="200" height="64" rx="10" fill="#101a2b"/>
    <rect x="720" y="100" width="236" height="64" rx="10" fill="#172033"/>
    <rect x="236" y="240" width="200" height="64" rx="10" fill="#101a2b"/>
    <rect x="720" y="240" width="236" height="64" rx="10" fill="#101a2b"/>
  </g>
  <g fill="#dfe8f5" font-size="15" text-anchor="middle">
    <text x="109" y="138">DSH</text>
    <text x="336" y="130">apply(ctx)</text>
    <text x="336" y="150" fill="#9fb0c8" font-size="13">lib/index.js</text>
    <text x="578" y="130">loopback route</text>
    <text x="578" y="150" fill="#9fb0c8" font-size="13">127.0.0.1 + auth</text>
    <text x="838" y="130">HTTP listener</text>
    <text x="838" y="150" fill="#9fb0c8" font-size="13">own port</text>
    <text x="336" y="278">GET /spike/health</text>
    <text x="838" y="278">dispose → close()</text>
  </g>
  <g stroke="#5b7cfa" stroke-width="2" marker-end="url(#a)" fill="none">
    <path d="M194 132 H236"/>
    <path d="M436 132 H478"/>
    <path d="M678 132 H720"/>
    <path d="M838 164 V240"/>
  </g>
  <g stroke="#3fb27f" stroke-width="2" marker-end="url(#b)" fill="none">
    <path d="M720 272 H436"/>
    <path d="M236 272 H194 V164"/>
  </g>
  <text x="24" y="340" fill="#9fb0c8" font-size="13">Contract: in-process, loopback-only, resources released through ctx.effect.</text>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9z" fill="#5b7cfa"/></marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9z" fill="#3fb27f"/></marker>
  </defs>
