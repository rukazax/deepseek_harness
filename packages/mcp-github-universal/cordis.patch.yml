# Универсальный доступ к GitHub по MCP.
# Основной путь — локальный официальный сервер github-mcp-server (бинарник в $DSH_HOME/bin,
# понимает fine-grained PAT): он и занимает toolset "github".
# Облачный сервер api.githubcopilot.com оставлен как "github-cloud": на хостах без
# Copilot-доступа он отвечает 403 «forbidden: access denied» на любой класс токенов
# (проверено на gho_- и fine-grained PAT) и остаётся offline благодаря failOnStartupError: false.
# Секреты не хранятся в пакете: токен и GITHUB_TOOLSETS читаются из переменных окружения.
- insert:
    # Локальный официальный GitHub MCP Server: репозитории, файлы, issues, PR, Actions...
    - id: mcp-github-local
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: github
        transport: stdio
        command: !!js dshHomePath('bin/github-mcp-server')
        args: ['stdio']
        toolCallTimeoutMs: 120000
        failOnStartupError: false

    # Облачный GitHub (все toolsets): подключается только там, где аккаунту доступен
    # Copilot-эндпоинт; иначе остаётся offline и не мешает локальному серверу.
    - id: mcp-github-cloud
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: github-cloud
        transport: streamable-http
        url: https://api.githubcopilot.com/mcp/x/all
        toolCallTimeoutMs: 120000
        headers:
          Authorization: !!js "process.env.GITHUB_PERSONAL_ACCESS_TOKEN ? 'Bearer ' + process.env.GITHUB_PERSONAL_ACCESS_TOKEN : ''"
        failOnStartupError: false
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 30000
          maxAttempts: 10

    # Локальный git: status, diff, add, commit, ветки, merge, log в репозиториях компьютера.
    # Windows держит интерпретатор venv в Scripts/, Linux — в bin/.
    - id: mcp-git-local
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: git
        transport: stdio
        command: !!js dshHomePath('venvs/mcp-git/Scripts/python.exe')
        args: ['-m', 'mcp_server_git']
        toolCallTimeoutMs: 120000
        failOnStartupError: true
