# GitHub по MCP — один локальный сервер, без дублей.
#
# Что здесь:
#   * github — официальный github-mcp-server (бинарник в $DSH_HOME/bin, понимает
#     fine-grained PAT). Единственная точка доступа к GitHub на этом хосте.
#
# Чего здесь больше нет (2026-11-17):
#   * github-cloud (api.githubcopilot.com/mcp/x/all). На этом хосте эндпоинт
#     отвечает 403 «forbidden: access denied» на любой класс токенов, а его
#     схемы инструментов дублировали локальные 90 имён (плюс он единственный
#     отдавал outputSchema без structuredContent и ронял вызовы).
#   * git (mcp-git-local с путём Windows Scripts/python.exe). Сервер git
#     объявлен в профиле (cordis.patch.yml профиля) с Linux-путём
#     venvs/mcp-git/bin/python; копия здесь создавала дубль id mcp-git-local
#     и на Linux не запускалась.
#
# Наборы инструментов GitHub читаются из окружения (GITHUB_TOOLSETS) в
# /etc/dsh/dsh-github.env: сейчас default,actions,gists,notifications,code_security
# (62 инструмента вместо 91 при all). Вернуть всё: GITHUB_TOOLSETS=all.
# Токен тоже из окружения — в пакете секретов нет.
- insert:
    - id: mcp-github-local
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: github
        transport: stdio
        command: !!js dshHomePath('bin/github-mcp-server')
        args: ['stdio']
        toolCallTimeoutMs: 120000
        # Сервер обязателен: без него теряется весь GitHub-доступ.
        failOnStartupError: true
