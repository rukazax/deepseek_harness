# Universal MCP для приложений Windows: готовые серверы (Office COM, Excel, GIMP 3, MSSQL LocalDB)
# Все серверы живут в ~/.dsh (venv + клон репозитория) вне ядра dsh — переживают его обновления.
# Каждый сервер — свой venv с изолированными зависимостями; запуск через console-скрипты (exe).
- insert:
    # Office COM: Word, Excel, PowerPoint, Outlook — запись в ОТКРЫТЫЕ документы
    - id: mcp-office
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: office
        transport: stdio
        command: C:/Users/AMNovez/.dsh/venvs/app-office/Scripts/officemcp.exe
        toolCallTimeoutMs: 120000
        failOnStartupError: false

    # Excel без установки Microsoft Excel — создание/чтение/редактирование xlsx
    - id: mcp-excel
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: excel
        transport: stdio
        command: C:/Users/AMNovez/.dsh/venvs/app-excel/Scripts/excel-mcp-server.exe
        args: ['stdio']
        env:
          EXCEL_FILES_PATH: !!js dshHomePath('workspace')
        toolCallTimeoutMs: 120000
        failOnStartupError: false

    # GIMP 3 — живое редактирование изображений через Script-Fu bridge
    # (автостарт headless GIMP если GUI GIMP не запущен)
    - id: mcp-gimp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: gimp
        transport: stdio
        command: C:/Users/AMNovez/.dsh/venvs/app-gimp/Scripts/gimp-mcp.exe
        env:
          GIMP_MCP_AUTOSTART: '1'
          GIMP_MCP_ALLOW_HEADLESS: '1'
        toolCallTimeoutMs: 120000
        failOnStartupError: false

    # Microsoft SQL Server — подключение через MSSQL_CONN (нужен MSSQL_USER/PASSWORD/DATABASE)
    # для pymssql (TCP + учётная запись SQL). LocalDB — отложено до точки настройки входов:
    # пока сервер стартует только при выставлённых переменных.
    - id: mcp-mssql
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js "!process.env.MSSQL_USER"
      config:
        serverName: mssql
        transport: stdio
        command: C:/Users/AMNovez/.dsh/venvs/app-mssql/Scripts/mssql_mcp_server.exe
        env:
          MSSQL_SERVER: !!js "process.env.MSSQL_SERVER ?? 'localhost'"
          MSSQL_USER: !!js "process.env.MSSQL_USER ?? ''"
          MSSQL_PASSWORD: !!js "process.env.MSSQL_PASSWORD ?? ''"
          MSSQL_DATABASE: !!js "process.env.MSSQL_DATABASE ?? ''"
        toolCallTimeoutMs: 120000
        failOnStartupError: false

    # WinRAR — свой собственный MCP-плагин (Rar.exe/UnRAR.exe CLI bridge).
    # Windows-приложение WinRAR установлено, но готовых MCP под него нет.
    - id: mcp-winrar
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: winrar
        transport: stdio
        command: C:/Users/AMNovez/.dsh/venvs/app-winrar/Scripts/python.exe
        args: ['C:/Users/AMNovez/.dsh/mcp-custom/winrar/server.py']
        toolCallTimeoutMs: 120000
        failOnStartupError: false

    # Яндекс.Диск — свой собственный MCP-плагин (на локальную зеркальную папку).
    # Готовые под Yandex Disk используют streamable-http + OAuth: требуют токен и порт,
    # локальная зеркальная папка на порядки практичнее для агента.
    - id: mcp-yadisk
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: yadisk
        transport: stdio
        command: C:/Users/AMNovez/.dsh/venvs/app-yadiskfs/Scripts/python.exe
        args: ['C:/Users/AMNovez/.dsh/mcp-custom/yadisk/server.py']
        env:
          YANDEX_DISK_ROOT: !!js "(process.env.YANDEX_DISK_ROOT ?? 'D:\\\\Яндекс.Диск')"
        toolCallTimeoutMs: 60000
        failOnStartupError: false

    # PDF (Foxit PDF Editor / Adobe Acrobat COM + pypdf) — свой собственный.
    # Foxit / Acrobat не имеют готовых MCP; пакет открывает PDF-файлы, извлекает текст,
    # склеивает/разбивает/считает страницы и запускает Foxit по COM.
    - id: mcp-pdf
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: pdf
        transport: stdio
        command: C:/Users/AMNovez/.dsh/venvs/app-pdf/Scripts/python.exe
        args: ['C:/Users/AMNovez/.dsh/mcp-custom/pdf/server.py']
        toolCallTimeoutMs: 120000
        failOnStartupError: false

    # SketchUp 2026 (COM automation: Skp.Application) — свой собственный.
    # Готовых под SketchUp нет; пакет достёгивает модель и отправляет Ruby (COM bridged).
    - id: mcp-sketchup
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: sketchup
        transport: stdio
        command: C:/Users/AMNovez/.dsh/venvs/app-sketchup/Scripts/python.exe
        args: ['C:/Users/AMNovez/.dsh/mcp-custom/sketchup/server.py']
        toolCallTimeoutMs: 120000
        failOnStartupError: false

    # Autodesk Navisworks 2026 (COM automation: Navisworks.Application) — свой собственный.
    - id: mcp-navisworks
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: navisworks
        transport: stdio
        command: C:/Users/AMNovez/.dsh/venvs/app-navisworks/Scripts/python.exe
        args: ['C:/Users/AMNovez/.dsh/mcp-custom/navisworks/server.py']
        toolCallTimeoutMs: 120000
        failOnStartupError: false

    # Obsidian vault — свой собственный (облегчённый, без векторного поиска):
    # read/write/delete/list/search по телу заметок + filename-based поиск.
    # (memory-hub уже мониторит vault автоматически; здесь агенту напрямую для управления).
    - id: mcp-vault
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: vault
        transport: stdio
        command: C:/Users/AMNovez/.dsh/venvs/app-vault/Scripts/python.exe
        args: ['C:/Users/AMNovez/.dsh/mcp-custom/vault/server.py']
        env:
          OBSIDIAN_VAULT: !!js dshHomePath('obsidian/vault')
        toolCallTimeoutMs: 60000
        failOnStartupError: false
